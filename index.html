<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Decomposition Tree</title>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/@sigmacomputing/plugin@1.2.0/dist/umd/sigmacomputing-plugin.umd.js"></script>
  <style>
    :root {
      --pos: #1a7f37;      /* green (favorable)   */
      --neg: #c0392b;      /* red   (unfavorable) */
      --ink: #1f2933;
      --muted: #8a939b;
      --line: #d5d9de;
      --header-bg: #eef0f2;
      --accent: #2f6fed;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: #fff;
    }
    #app { display: flex; flex-direction: column; height: 100vh; }

    /* ---- Toolbar (edit mode only) ---- */
    #toolbar {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      background: #fafbfc;
      flex: 0 0 auto;
      font-size: 13px;
    }
    #toolbar.show { display: flex; }
    #toolbar .spacer { flex: 1; }
    button.tb {
      font: inherit;
      font-size: 13px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    button.tb:hover { background: #f0f2f5; }
    button.tb.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.tb.primary:hover { background: #285cc4; }
    #toolbar label.chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--muted); }

    /* ---- Breadcrumb bar ---- */
    #crumbs {
      display: none; align-items: center; gap: 6px; flex-wrap: wrap;
      padding: 6px 12px; border-bottom: 1px solid var(--line);
      background: #fff; font-size: 12.5px; flex: 0 0 auto;
    }
    #crumbs.show { display: flex; }
    #crumbs .lbl { color: var(--muted); margin-right: 2px; }
    #crumbs .crumb { color: var(--accent); cursor: pointer; }
    #crumbs .crumb:hover { text-decoration: underline; }
    #crumbs .sep { color: var(--muted); }
    #crumbs .cur { color: var(--ink); font-weight: 600; }
    #crumbs .clear {
      margin-left: auto; border: 1px solid var(--line); background: #fff;
      border-radius: 6px; padding: 3px 9px; cursor: pointer; color: var(--muted);
      font: inherit; font-size: 12px;
    }
    #crumbs .clear:hover { background: #f0f2f5; }

    /* ---- Stage ---- */
    #stage {
      position: relative;
      flex: 1 1 auto;
      overflow: auto;
      background:
        radial-gradient(circle, #e9ecef 1px, transparent 1px);
      background-size: 22px 22px;
    }
    #stage svg { display: block; margin: 0 auto; }

    .msg {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      text-align: center; color: var(--muted); padding: 24px; font-size: 14px;
    }
    .msg .big { font-size: 15px; color: var(--ink); margin-bottom: 8px; font-weight: 600; }
    .msg button { margin-top: 14px; }

    /* SVG interactive bits */
    .ctl { cursor: pointer; }
    .ctl:hover .ctl-bg { fill: #e6ebf5; }

    /* ---- Modal ---- */
    #overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(20,25,31,.35);
      align-items: center; justify-content: center;
      z-index: 50;
    }
    #overlay.show { display: flex; }
    #modal {
      background: #fff; width: 380px; max-width: calc(100vw - 32px);
      max-height: calc(100vh - 40px); overflow: auto;
      border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.25);
      padding: 18px 20px;
    }
    #modal h3 { margin: 0 0 14px; font-size: 15px; }
    #modal .field { margin-bottom: 12px; }
    #modal label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    #modal input[type=text], #modal select {
      width: 100%; font: inherit; font-size: 13px;
      padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff;
    }
    #modal .row { display: flex; gap: 10px; }
    #modal .row .field { flex: 1; }
    #modal .inline { display: flex; align-items: center; gap: 8px; }
    #modal .inline label { margin: 0; }
    #modal .actions { display: flex; gap: 8px; margin-top: 18px; }
    #modal .actions .spacer { flex: 1; }
    #modal .hint { font-size: 11px; color: var(--muted); margin-top: 2px; }
    button.danger { border-color: #e3b3ad; color: var(--neg); background: #fff; }
    button.danger:hover { background: #fdecea; }
  </style>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <button class="tb primary" id="btn-add-root">＋ Add box</button>
      <span class="spacer"></span>
      <label class="chk"><input type="checkbox" id="chk-fit" /> Scale to fit</label>
    </div>
    <div id="crumbs"></div>
    <div id="stage"></div>
  </div>

  <!-- Editor modal -->
  <div id="overlay">
    <div id="modal">
      <h3 id="modal-title">Configure box</h3>

      <div class="field">
        <label>Title</label>
        <input type="text" id="f-title" placeholder="e.g. Total Profit per Customer" />
      </div>

      <div class="field">
        <label>Main value column</label>
        <select id="f-value"></select>
      </div>

      <div class="field">
        <label>Variance mode</label>
        <select id="f-varmode">
          <option value="column">Bound column (direct)</option>
          <option value="pct">Computed: % change vs comparison</option>
          <option value="delta">Computed: delta vs comparison</option>
        </select>
        <div class="hint" id="varmode-hint">Displays the value of a variance column directly.</div>
      </div>

      <div class="row">
        <div class="field" id="wrap-varcol">
          <label>Variance column</label>
          <select id="f-variance"></select>
        </div>
        <div class="field" id="wrap-compcol" style="display:none">
          <label>Comparison column</label>
          <select id="f-comparison"></select>
        </div>
        <div class="field" style="flex:0 0 90px">
          <label>Suffix</label>
          <input type="text" id="f-varsuffix" placeholder="e.g. pp" />
          <div class="hint">optional</div>
        </div>
      </div>

      <div class="field inline">
        <input type="checkbox" id="f-hib" />
        <label for="f-hib">Higher is better (green when variance ≥ 0)</label>
      </div>

      <div class="row">
        <div class="field">
          <label>Bottom-left label</label>
          <input type="text" id="f-c1label" placeholder="e.g. Loyalty" />
        </div>
        <div class="field">
          <label>Bottom-left column</label>
          <select id="f-c1col"></select>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>Bottom-right label</label>
          <input type="text" id="f-c2label" placeholder="e.g. Non-Loyalty" />
        </div>
        <div class="field">
          <label>Bottom-right column</label>
          <select id="f-c2col"></select>
        </div>
      </div>

      <div class="field">
        <label>Value sent on click (optional)</label>
        <input type="text" id="f-selval" placeholder="defaults to the title" />
        <div class="hint">Written to the Select variable / action when a viewer clicks this box.</div>
      </div>

      <div class="actions">
        <button class="tb danger" id="btn-delete">Delete box</button>
        <span class="spacer"></span>
        <button class="tb" id="btn-cancel">Cancel</button>
        <button class="tb primary" id="btn-save">Save</button>
      </div>
    </div>
  </div>

  <script>
  (function () {
    "use strict";
    // The UMD bundle registers the global `SigmaPlugin`; fall back to older names just in case.
    var SDK = window.SigmaPlugin ||
      (window.sigmaComputing && window.sigmaComputing.plugin) ||
      window["@sigmacomputing/plugin"];
    if (!SDK || !SDK.client) {
      var el = document.getElementById("stage");
      if (el) el.innerHTML = '<div class="msg"><div><div class="big">Plugin SDK failed to load</div>' +
        'The Sigma plugin script could not be reached. Reload the workbook; if it persists, check that the plugin URL is publicly accessible.</div></div>';
      return;
    }
    const client = SDK.client;

    /* ============ editor panel ============ */
    client.config.configureEditorPanel([
      { name: "source", type: "element" },
      { name: "selectVar", type: "variable", allowedTypes: ["text"], label: "Select → variable (optional)" },
      { name: "onSelect", type: "action-trigger", label: "Select → action (optional)" },
      { name: "config", type: "text", label: "Tree config (JSON — managed by the plugin)", defaultValue: "" },
      { name: "editMode", type: "toggle", label: "Edit mode" }
    ]);

    /* ============ constants ============ */
    const BOX_W = 220, BOX_H = 148;
    const H_GAP = 30, V_GAP = 56, PAD = 26;
    const POS = "#1a7f37", NEG = "#c0392b", NEUTRAL = "#1f2933";

    const DEFAULTS = { version: 1, scaleToFit: true, roots: [] };

    /* ============ state ============ */
    let CONFIG = {};
    let COLUMNS = {};       // { colId: {name, columnType, format} }
    let DATA = {};          // { colId: value[] }
    let SETTINGS = clone(DEFAULTS);
    let unsubData = null, unsubCols = null, curSource = null;
    let selectedId = null;      // current click-to-filter selection (session only)
    const localCollapse = {};   // id -> bool, viewer's ephemeral collapse overrides

    const stage = document.getElementById("stage");
    const toolbar = document.getElementById("toolbar");
    const crumbs = document.getElementById("crumbs");

    /* ============ helpers ============ */
    function clone(o) { return JSON.parse(JSON.stringify(o)); }
    function uid() { return "n" + Math.random().toString(36).slice(2, 9); }
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function firstVal(colId) {
      if (!colId) return null;
      const arr = DATA[colId];
      if (!arr || !arr.length) return null;
      for (let i = 0; i < arr.length; i++) if (arr[i] != null) return arr[i];
      return null;
    }
    function truncate(s, max) {
      s = String(s == null ? "" : s);
      return s.length > max ? s.slice(0, Math.max(0, max - 1)) + "…" : s;
    }

    function parseFmt(fmt) {
      const out = { prefix: "", suffix: "", decimals: null, percent: false, compact: false, thousands: false };
      if (!fmt) return out;
      if (fmt.indexOf("$") >= 0) out.prefix = "$";
      if (fmt.indexOf(",") >= 0) out.thousands = true;
      if (fmt.indexOf("%") >= 0) { out.percent = true; out.suffix = "%"; }
      if (/[sS]$/.test(fmt)) out.compact = true;
      const m = fmt.match(/\.(\d+)/);
      if (m) out.decimals = parseInt(m[1], 10);
      return out;
    }
    function fmtNum(v, decimals, thousands) {
      const opts = { useGrouping: !!thousands };
      if (decimals != null) { opts.minimumFractionDigits = decimals; opts.maximumFractionDigits = decimals; }
      else { opts.maximumFractionDigits = 2; }
      return v.toLocaleString("en-US", opts);
    }
    function compact(v, dec) {
      const abs = Math.abs(v), d = dec == null ? 1 : dec;
      if (abs >= 1e9) return (v / 1e9).toFixed(d) + "B";
      if (abs >= 1e6) return (v / 1e6).toFixed(d) + "M";
      if (abs >= 1e3) return (v / 1e3).toFixed(d) + "K";
      return v.toFixed(d);
    }
    function formatVal(colId, raw) {
      if (raw == null) return "—";
      let num = typeof raw === "number" ? raw : parseFloat(raw);
      if (isNaN(num)) return String(raw);
      const meta = COLUMNS[colId] || {};
      const fmt = meta.format || {};
      const p = parseFmt(fmt.format || "");
      if (fmt.type === "currency") p.prefix = "$";
      if (fmt.type === "percent") { p.percent = true; p.suffix = "%"; }
      if (fmt.type === "compact") p.compact = true;
      let val = p.percent ? num * 100 : num;
      const neg = val < 0;
      if (neg) val = Math.abs(val);
      const wantThousands = p.thousands || fmt.type === "currency" || fmt.type === "number";
      const s = p.compact ? compact(val, p.decimals) : fmtNum(val, p.decimals, wantThousands);
      return (neg ? "-" : "") + p.prefix + s + p.suffix;
    }
    function numOf(v) {
      if (v == null) return null;
      const n = typeof v === "number" ? v : parseFloat(v);
      return isNaN(n) ? null : n;
    }
    function fmtPct(r) {
      return (r * 100).toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";
    }

    /* ============ config / data plumbing ============ */
    function loadSettings(str) {
      if (!str || !str.trim()) return clone(DEFAULTS);
      try {
        const parsed = JSON.parse(str);
        return Object.assign(clone(DEFAULTS), parsed);
      } catch (e) {
        console.warn("Bad tree config JSON:", e);
        return clone(DEFAULTS);
      }
    }
    function saveSettings() {
      client.config.set({ config: JSON.stringify(SETTINGS) });
    }

    client.config.subscribe(function (cfg) {
      CONFIG = cfg || {};
      SETTINGS = loadSettings(CONFIG.config);
      resubscribe(CONFIG.source);
      renderAll();
    });

    function resubscribe(source) {
      if (source === curSource) return;
      if (unsubData) { unsubData(); unsubData = null; }
      if (unsubCols) { unsubCols(); unsubCols = null; }
      curSource = source;
      COLUMNS = {}; DATA = {};
      if (!source) return;
      unsubCols = client.elements.subscribeToElementColumns(source, function (cols) {
        COLUMNS = cols || {};
        renderAll();
      });
      unsubData = client.elements.subscribeToElementData(source, function (data) {
        DATA = data || {};
        renderAll();
      });
    }

    /* ============ tree utilities ============ */
    function walk(nodes, fn, parent) {
      (nodes || []).forEach(function (n) { fn(n, parent); walk(n.children, fn, n); });
    }
    function findNode(id) {
      let found = null;
      walk(SETTINGS.roots, function (n) { if (n.id === id) found = n; });
      return found;
    }
    function removeNode(id) {
      function rec(list) {
        for (let i = 0; i < list.length; i++) {
          if (list[i].id === id) { list.splice(i, 1); return true; }
          if (rec(list[i].children || [])) return true;
        }
        return false;
      }
      rec(SETTINGS.roots);
    }
    function isCollapsed(node) {
      return Object.prototype.hasOwnProperty.call(localCollapse, node.id)
        ? localCollapse[node.id] : !!node.collapsed;
    }
    function effKids(node) {
      return isCollapsed(node) ? [] : (node.children || []);
    }
    function visibleNodes(roots) {
      const out = [];
      (function rec(list) { list.forEach(function (n) { out.push(n); rec(effKids(n)); }); })(roots);
      return out;
    }
    function pathTo(id) {
      const parent = {};
      walk(SETTINGS.roots, function (n, p) { if (p) parent[n.id] = p.id; });
      const chain = [];
      let cur = findNode(id);
      while (cur) { chain.unshift(cur); cur = parent[cur.id] ? findNode(parent[cur.id]) : null; }
      return chain;
    }
    function newNode() {
      return {
        id: uid(), title: "New KPI",
        valueCol: "",
        varMode: "column", varianceCol: "", comparisonCol: "", varianceSuffix: "", higherIsBetter: true,
        c1Label: "", c1Col: "", c2Label: "", c2Col: "",
        selectValue: "",
        children: []
      };
    }

    /* ============ layout (tidy tree) ============ */
    function layoutForest(roots) {
      let maxDepth = 0;
      function measure(node) {
        const kids = effKids(node);
        if (!kids.length) { node._w = BOX_W; return BOX_W; }
        let total = 0;
        kids.forEach(function (c, i) { total += measure(c); if (i > 0) total += H_GAP; });
        node._w = Math.max(BOX_W, total);
        return node._w;
      }
      function place(node, x, depth) {
        maxDepth = Math.max(maxDepth, depth);
        const kids = effKids(node);
        if (!kids.length) {
          node._x = x + (node._w - BOX_W) / 2;
        } else {
          let cx = x;
          kids.forEach(function (c, i) { if (i > 0) cx += H_GAP; place(c, cx, depth + 1); cx += c._w; });
          const first = kids[0], last = kids[kids.length - 1];
          node._x = (first._x + last._x + BOX_W) / 2 - BOX_W / 2;
        }
        node._y = depth * (BOX_H + V_GAP);
      }
      let x = 0;
      roots.forEach(function (r, i) { if (i > 0) x += H_GAP; measure(r); place(r, x, 0); x += r._w; });
      return { width: Math.max(BOX_W, x), height: (maxDepth + 1) * BOX_H + maxDepth * V_GAP };
    }

    /* ============ SVG rendering ============ */
    function edgePath(px, py, cx, cy) {
      const midY = (py + cy) / 2;
      return "M " + px + " " + py + " C " + px + " " + midY + ", " + cx + " " + midY + ", " + cx + " " + cy;
    }

    function nodeSVG(node, editMode) {
      const x = node._x + PAD, y = node._y + PAD;
      const cx = x + BOX_W / 2;

      // main value
      const valStr = formatVal(node.valueCol, firstVal(node.valueCol));

      // variance — direct column, or computed vs a comparison column
      const suffix = node.varianceSuffix ? " " + node.varianceSuffix : "";
      const mode = node.varMode || "column";
      let varNum = null, varStr = "";
      if (mode === "pct" || mode === "delta") {
        const cur = numOf(firstVal(node.valueCol));
        const comp = numOf(firstVal(node.comparisonCol));
        if (cur != null && comp != null) {
          if (mode === "pct") {
            if (comp !== 0) { varNum = (cur - comp) / comp; varStr = fmtPct(varNum) + suffix; }
          } else { varNum = cur - comp; varStr = formatVal(node.valueCol, varNum) + suffix; }
        }
      } else {
        const raw = firstVal(node.varianceCol);
        varNum = numOf(raw);
        if (varNum != null) varStr = formatVal(node.varianceCol, raw) + suffix;
      }

      const hib = node.higherIsBetter !== false;
      let color = NEUTRAL, arrow = "";
      if (varNum != null) {
        const favorable = hib ? varNum >= 0 : varNum <= 0;
        color = favorable ? POS : NEG;
        arrow = varNum >= 0 ? "▲" : "▼";
        varStr = arrow + " " + varStr;
      }

      const titleMax = editMode ? 24 : 30;
      const clickable = editMode || CONFIG.selectVar || CONFIG.onSelect;
      const parts = [];
      parts.push('<g data-action="node" data-id="' + node.id + '"' + (clickable ? ' style="cursor:pointer"' : "") + ">");

      // box + shadow
      const selected = node.id === selectedId;
      const strokeCol = selected ? "#2f6fed" : "#d0d5da";
      const strokeW = selected ? 2 : 1;
      parts.push('<rect x="' + x + '" y="' + y + '" width="' + BOX_W + '" height="' + BOX_H +
        '" rx="7" fill="#ffffff" stroke="' + strokeCol + '" stroke-width="' + strokeW + '" filter="url(#shadow)"/>');
      // header band (rounded top only)
      const r = 7, hh = 30;
      parts.push('<path d="M ' + x + ' ' + (y + hh) + ' L ' + x + ' ' + (y + r) +
        ' Q ' + x + ' ' + y + ' ' + (x + r) + ' ' + y +
        ' L ' + (x + BOX_W - r) + ' ' + y + ' Q ' + (x + BOX_W) + ' ' + y + ' ' + (x + BOX_W) + ' ' + (y + r) +
        ' L ' + (x + BOX_W) + ' ' + (y + hh) + ' Z" fill="var(--header-bg)"/>');
      parts.push('<line x1="' + x + '" y1="' + (y + hh) + '" x2="' + (x + BOX_W) + '" y2="' + (y + hh) + '" stroke="#e2e5e9"/>');
      // title
      parts.push('<text x="' + cx + '" y="' + (y + 20) + '" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3a4048">' +
        esc(truncate(node.title || "Untitled", titleMax)) + '</text>');

      // main value
      parts.push('<text x="' + cx + '" y="' + (y + 68) + '" text-anchor="middle" font-size="26" font-weight="700" fill="' + color + '">' +
        esc(valStr) + '</text>');
      // variance
      if (varStr) {
        parts.push('<text x="' + cx + '" y="' + (y + 92) + '" text-anchor="middle" font-size="13.5" font-weight="600" fill="' + color + '">' +
          esc(varStr) + '</text>');
      }

      // corners
      const cyDiv = y + BOX_H - 44;
      parts.push('<line x1="' + (x + 12) + '" y1="' + cyDiv + '" x2="' + (x + BOX_W - 12) + '" y2="' + cyDiv + '" stroke="#eceff2"/>');
      parts.push('<line x1="' + cx + '" y1="' + (cyDiv + 4) + '" x2="' + cx + '" y2="' + (y + BOX_H - 8) + '" stroke="#eceff2"/>');
      const lx = x + BOX_W * 0.27, rx = x + BOX_W * 0.73;
      function corner(px, label, colId) {
        if (!label && !colId) return;
        parts.push('<text x="' + px + '" y="' + (y + BOX_H - 26) + '" text-anchor="middle" font-size="9.5" fill="#8a939b">' +
          esc(truncate(label || "", 14)) + '</text>');
        parts.push('<text x="' + px + '" y="' + (y + BOX_H - 10) + '" text-anchor="middle" font-size="12" font-weight="600" fill="#2b323a">' +
          esc(colId ? formatVal(colId, firstVal(colId)) : "—") + '</text>');
      }
      corner(lx, node.c1Label, node.c1Col);
      corner(rx, node.c2Label, node.c2Col);

      // header controls: edit (pencil) + delete (x), edit mode only
      if (editMode) {
        parts.push('<g class="ctl" data-action="edit" data-id="' + node.id + '">' +
          '<rect class="ctl-bg" x="' + (x + BOX_W - 46) + '" y="' + (y + 6) + '" width="18" height="18" rx="4" fill="#ffffff" stroke="#d7dbe0"/>' +
          '<text x="' + (x + BOX_W - 37) + '" y="' + (y + 19) + '" text-anchor="middle" font-size="11" fill="#5a6470">✎</text></g>');
        parts.push('<g class="ctl" data-action="delete" data-id="' + node.id + '">' +
          '<rect class="ctl-bg" x="' + (x + BOX_W - 24) + '" y="' + (y + 6) + '" width="18" height="18" rx="4" fill="#ffffff" stroke="#d7dbe0"/>' +
          '<text x="' + (x + BOX_W - 15) + '" y="' + (y + 19) + '" text-anchor="middle" font-size="11" fill="#5a6470">✕</text></g>');
      }

      // bottom controls: collapse/expand toggle (any box with children) + add-child (edit only)
      const hasKids = (node.children || []).length > 0;
      const collapsed = isCollapsed(node);
      const items = [];
      if (hasKids) items.push("toggle");
      if (editMode) items.push("add");
      if (items.length) {
        const by = y + BOX_H + 18;
        items.forEach(function (it, i) {
          const bxc = cx + (i - (items.length - 1) / 2) * 30;
          if (it === "toggle") {
            parts.push('<g class="ctl" data-action="toggle" data-id="' + node.id + '">' +
              '<circle class="ctl-bg" cx="' + bxc + '" cy="' + by + '" r="12" fill="#ffffff" stroke="#b9c0c8"/>' +
              '<text x="' + bxc + '" y="' + (by + 4) + '" text-anchor="middle" font-size="12" fill="#5a6470">' +
              (collapsed ? "▸" : "▾") + '</text></g>');
            if (collapsed) {
              parts.push('<text x="' + (bxc + 15) + '" y="' + (by + 4) + '" font-size="10.5" fill="#8a939b">' +
                node.children.length + '</text>');
            }
          } else {
            parts.push('<g class="ctl" data-action="add" data-id="' + node.id + '">' +
              '<circle class="ctl-bg" cx="' + bxc + '" cy="' + by + '" r="12" fill="#ffffff" stroke="#b9c0c8"/>' +
              '<text x="' + bxc + '" y="' + (by + 4.5) + '" text-anchor="middle" font-size="16" font-weight="700" fill="#2f6fed">＋</text></g>');
          }
        });
      }

      parts.push('</g>');
      return parts.join("");
    }

    function showMsg(html) {
      stage.innerHTML = '<div class="msg">' + html + '</div>';
    }

    function draw() {
      const roots = SETTINGS.roots || [];
      const editMode = !!CONFIG.editMode;

      if (!CONFIG.source) {
        showMsg('<div><div class="big">Select a data source</div>Choose the element (a single aggregated row) in the plugin editor panel.</div>');
        return;
      }
      if (!roots.length) {
        if (editMode) {
          showMsg('<div><div class="big">No boxes yet</div>Build your decomposition tree.' +
            '<div><button class="tb primary" id="empty-add">＋ Add first box</button></div></div>');
          const b = document.getElementById("empty-add");
          if (b) b.onclick = function () { addRoot(); };
        } else {
          showMsg('<div><div class="big">Nothing configured</div>Turn on <b>Edit mode</b> in the editor panel to build the tree.</div>');
        }
        return;
      }

      const lay = layoutForest(roots);
      const extra = 34; // room for collapse/add controls under the last row
      const W = lay.width + PAD * 2;
      const H = lay.height + PAD * 2 + extra;

      const svgParts = [];
      svgParts.push('<defs>' +
        '<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">' +
        '<feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.14"/></filter>' +
        '<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
        '<path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa2ab"/></marker>' +
        '</defs>');

      const vis = visibleNodes(roots);
      // edges under boxes (only between visible nodes)
      vis.forEach(function (n) {
        const px = n._x + PAD + BOX_W / 2, py = n._y + PAD + BOX_H;
        effKids(n).forEach(function (c) {
          const cxp = c._x + PAD + BOX_W / 2, cyp = c._y + PAD;
          svgParts.push('<path d="' + edgePath(px, py, cxp, cyp) +
            '" fill="none" stroke="#9aa2ab" stroke-width="2.4" marker-end="url(#arrow)"/>');
        });
      });
      // boxes above edges
      vis.forEach(function (n) { svgParts.push(nodeSVG(n, editMode)); });

      const cw = stage.clientWidth || W, ch = stage.clientHeight || H;
      const fit = SETTINGS.scaleToFit !== false;
      let attrW = W, attrH = H;
      if (fit) {
        const scale = Math.min(cw / W, ch / H, 1);
        attrW = Math.round(W * scale); attrH = Math.round(H * scale);
        stage.style.overflow = "hidden";
      } else {
        stage.style.overflow = "auto";
      }

      stage.innerHTML =
        '<svg xmlns="http://www.w3.org/2000/svg" width="' + attrW + '" height="' + attrH +
        '" viewBox="0 0 ' + W + " " + H + '">' + svgParts.join("") + '</svg>';
    }

    /* ============ actions ============ */
    function addRoot() {
      const n = newNode();
      SETTINGS.roots.push(n);
      saveSettings();
      openEditor(n.id);
    }
    function addChild(parentId) {
      const p = findNode(parentId);
      if (!p) return;
      const n = newNode();
      (p.children = p.children || []).push(n);
      saveSettings();
      openEditor(n.id);
    }
    function deleteNode(id) {
      const n = findNode(id);
      const kids = n && n.children && n.children.length;
      const label = n ? (n.title || "this box") : "this box";
      if (!confirm('Delete "' + label + '"' + (kids ? " and its " + kids + " child box(es)" : "") + "?")) return;
      removeNode(id);
      saveSettings();
      closeEditor();
    }

    function selectNode(id) {
      const n = findNode(id);
      if (!n) return;
      if (selectedId === id) { clearSelection(); return; } // click selected box again -> reset
      selectedId = id;
      const val = n.selectValue && n.selectValue.trim() ? n.selectValue.trim() : (n.title || "");
      try {
        if (CONFIG.selectVar) client.config.setVariable("selectVar", String(val));
        if (CONFIG.onSelect) client.config.triggerAction("onSelect");
      } catch (e) { console.warn("select failed:", e); }
      draw(); renderCrumbs();
    }
    function clearSelection() {
      selectedId = null;
      try {
        if (CONFIG.selectVar) client.config.setVariable("selectVar", "");
        if (CONFIG.onSelect) client.config.triggerAction("onSelect");
      } catch (e) { console.warn("clear failed:", e); }
      draw(); renderCrumbs();
    }
    function toggleCollapse(id) {
      const n = findNode(id);
      if (!n) return;
      const next = !isCollapsed(n);
      localCollapse[id] = next;
      if (CONFIG.editMode) { n.collapsed = next; saveSettings(); } // authors persist the default
      else { draw(); }                                             // viewers stay ephemeral
    }
    function renderCrumbs() {
      const active = selectedId && (CONFIG.selectVar || CONFIG.onSelect) && !CONFIG.editMode;
      if (!active) { crumbs.classList.remove("show"); crumbs.innerHTML = ""; return; }
      const path = pathTo(selectedId);
      let html = '<span class="lbl">Selected:</span>';
      path.forEach(function (node, i) {
        if (i > 0) html += '<span class="sep">›</span>';
        const last = i === path.length - 1;
        html += last
          ? '<span class="cur">' + esc(node.title || "Untitled") + "</span>"
          : '<span class="crumb" data-crumb="' + node.id + '">' + esc(node.title || "Untitled") + "</span>";
      });
      html += '<button class="clear" data-clear="1">✕ Clear</button>';
      crumbs.innerHTML = html;
      crumbs.classList.add("show");
    }
    crumbs.addEventListener("click", function (e) {
      const c = e.target.closest("[data-crumb]");
      if (c) { selectNode(c.getAttribute("data-crumb")); return; }
      if (e.target.closest("[data-clear]")) clearSelection();
    });

    // stage click delegation (SVG controls)
    stage.addEventListener("click", function (e) {
      const g = e.target.closest("[data-action]");
      if (!g) return;
      const action = g.getAttribute("data-action");
      const id = g.getAttribute("data-id");
      if (action === "add") addChild(id);
      else if (action === "edit") openEditor(id);
      else if (action === "delete") deleteNode(id);
      else if (action === "toggle") toggleCollapse(id);
      else if (action === "node") {
        if (CONFIG.editMode) openEditor(id);
        else if (CONFIG.selectVar || CONFIG.onSelect) selectNode(id);
      }
    });

    /* ============ modal ============ */
    const overlay = document.getElementById("overlay");
    let editingId = null;

    function columnOptions(selected) {
      // numeric-first; fall back to all if none numeric
      const ids = Object.keys(COLUMNS);
      const numeric = ids.filter(function (id) {
        const t = (COLUMNS[id].columnType || "").toLowerCase();
        return t === "number" || t === "integer";
      });
      const list = numeric.length ? numeric : ids;
      let html = '<option value="">— none —</option>';
      list.forEach(function (id) {
        const name = (COLUMNS[id] && COLUMNS[id].name) || id;
        html += '<option value="' + esc(id) + '"' + (id === selected ? " selected" : "") + ">" + esc(name) + "</option>";
      });
      // keep a stale selection visible even if not in current list
      if (selected && list.indexOf(selected) < 0) {
        const name = (COLUMNS[selected] && COLUMNS[selected].name) || selected;
        html += '<option value="' + esc(selected) + '" selected>' + esc(name) + " (missing)</option>";
      }
      return html;
    }

    const VARMODE_HINTS = {
      column: "Displays the value of a variance column directly.",
      pct: "(main value − comparison) ÷ comparison, shown as a %.",
      delta: "main value − comparison, shown in the value's format."
    };
    function syncVarModeFields() {
      const mode = document.getElementById("f-varmode").value;
      document.getElementById("wrap-varcol").style.display = mode === "column" ? "" : "none";
      document.getElementById("wrap-compcol").style.display = mode === "column" ? "none" : "";
      document.getElementById("varmode-hint").textContent = VARMODE_HINTS[mode] || "";
    }

    function openEditor(id) {
      const n = findNode(id);
      if (!n) return;
      editingId = id;
      document.getElementById("f-title").value = n.title || "";
      document.getElementById("f-value").innerHTML = columnOptions(n.valueCol);
      document.getElementById("f-varmode").value = n.varMode || "column";
      document.getElementById("f-variance").innerHTML = columnOptions(n.varianceCol);
      document.getElementById("f-comparison").innerHTML = columnOptions(n.comparisonCol);
      document.getElementById("f-varsuffix").value = n.varianceSuffix || "";
      document.getElementById("f-hib").checked = n.higherIsBetter !== false;
      document.getElementById("f-c1label").value = n.c1Label || "";
      document.getElementById("f-c1col").innerHTML = columnOptions(n.c1Col);
      document.getElementById("f-c2label").value = n.c2Label || "";
      document.getElementById("f-c2col").innerHTML = columnOptions(n.c2Col);
      document.getElementById("f-selval").value = n.selectValue || "";
      syncVarModeFields();
      overlay.classList.add("show");
    }
    document.getElementById("f-varmode").addEventListener("change", syncVarModeFields);
    function closeEditor() { editingId = null; overlay.classList.remove("show"); }

    document.getElementById("btn-save").onclick = function () {
      const n = findNode(editingId);
      if (!n) { closeEditor(); return; }
      n.title = document.getElementById("f-title").value;
      n.valueCol = document.getElementById("f-value").value;
      n.varMode = document.getElementById("f-varmode").value;
      n.varianceCol = document.getElementById("f-variance").value;
      n.comparisonCol = document.getElementById("f-comparison").value;
      n.varianceSuffix = document.getElementById("f-varsuffix").value.trim();
      n.higherIsBetter = document.getElementById("f-hib").checked;
      n.c1Label = document.getElementById("f-c1label").value;
      n.c1Col = document.getElementById("f-c1col").value;
      n.c2Label = document.getElementById("f-c2label").value;
      n.c2Col = document.getElementById("f-c2col").value;
      n.selectValue = document.getElementById("f-selval").value.trim();
      saveSettings();
      closeEditor();
    };
    document.getElementById("btn-cancel").onclick = closeEditor;
    document.getElementById("btn-delete").onclick = function () { if (editingId) deleteNode(editingId); };
    overlay.addEventListener("click", function (e) { if (e.target === overlay) closeEditor(); });

    /* ============ toolbar ============ */
    document.getElementById("btn-add-root").onclick = addRoot;
    const chkFit = document.getElementById("chk-fit");
    chkFit.onchange = function () { SETTINGS.scaleToFit = chkFit.checked; saveSettings(); };

    /* ============ render orchestration ============ */
    function renderAll() {
      const editMode = !!CONFIG.editMode;
      toolbar.classList.toggle("show", editMode);
      chkFit.checked = SETTINGS.scaleToFit !== false;
      if (!editMode) closeEditor();
      draw();
      renderCrumbs();
    }

    // redraw on container resize (required — Sigma sizes the iframe after first paint)
    if (window.ResizeObserver) new ResizeObserver(function () { draw(); }).observe(stage);
    window.addEventListener("resize", draw);
  })();
  </script>
</body>
</html>
